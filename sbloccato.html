<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegasdrama - Area Sbloccata</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #141414; color: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #141414; border-bottom: 1px solid #333; }
        .logo { color: #e50914; font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; font-size: 16px; }
        
        /* Box del video Vimeo in stile cinematografico */
        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            margin-bottom: 30px;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .back-btn { display: inline-block; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 4px; transition: background 0.3s; }
        .back-btn:hover { background: #e50914; }
    </style>
</head>
<body>

    <header>
        <div class="logo">VEGASDRAMA</div>
    </header>

    <div class="container">
        <h1>Area Riservata - Contenuto Sbloccato</h1>
        <p>Grazie per aver scelto i nostri piani. Ecco la tua mini-serie pronta per la riproduzione.</p>

        <!-- Player Vimeo incorporato -->
        <div class="video-box">
            <iframe src="https://player.vimeo.com/video/1236723346?badge=0&autopause=0&player_id=0&app_id=58798" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" title="Watch System Crash: Tyrant's Obsession Episode 1"></iframe>
        </div>

        <a href="index.html" class="back-btn">← Torna alla Home</a>
    </div>

</body>
</html>
